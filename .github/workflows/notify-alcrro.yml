name: Notify alcrro on resume.json change

on:
  push:
    paths:
      - "resume.json"
  workflow_dispatch: {}   # manual trigger button in the Actions tab

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alcrro README rebuild
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.ALCRRO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Alcrro/alcrro/dispatches \
            -d '{"event_type":"resume-updated"}' \
            -w "\nHTTP status: %{http_code}\n"
